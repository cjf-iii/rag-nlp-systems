name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --locked --group dev --group notebook
      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Unit and integration tests
        run: uv run python -m unittest discover -s tests -v
      - name: Execute reviewer notebook
        run: uv run --group notebook jupyter nbconvert --to notebook --execute notebooks/01_data_to_validation.ipynb --stdout > /dev/null
      - name: CLI smoke test
        run: |
          uv run rag-nlp index --corpus data/knowledge --output artifacts/knowledge.joblib
          uv run rag-nlp ask --index artifacts/knowledge.joblib --question "How does batching affect inference capacity?"
          uv run rag-nlp sentiment-train --data data/sentiment.csv --output artifacts/sentiment.joblib
          uv run rag-nlp sentiment-predict --model artifacts/sentiment.joblib --text "The benchmark was clear and reproducible"
          uv run python scripts/verify_artifacts.py
