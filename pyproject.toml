[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-nlp-systems"
version = "1.0.0"
description = "Local-first RAG and NLP pipelines with citations, persistence, and evaluation."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "CJ Fleming" }]
dependencies = [
  "joblib>=1.4,<2",
  "numpy>=1.26,<2.5",
  "scikit-learn>=1.5,<2",
]

[project.scripts]
rag-nlp = "rag_nlp_systems.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
