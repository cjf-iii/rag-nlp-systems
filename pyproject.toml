[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-nlp-systems"
version = "1.0.0"
description = "Local-first RAG and NLP pipelines with citations, persistence, and evaluation."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "CJ Fleming" }]
dependencies = [
  "joblib>=1.4,<2",
  "numpy>=1.26,<2.5",
  "scikit-learn>=1.5,<2",
]

[dependency-groups]
dev = [
  "ruff>=0.16,<0.17",
]
notebook = [
  "ipykernel>=7,<8",
  "jupyterlab>=4.5,<5",
  "nbconvert>=7.17,<8",
]

[project.scripts]
rag-nlp = "rag_nlp_systems.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
